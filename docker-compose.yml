networks:
  resolver-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  redis_data:
  logs_data:
  sqlite_data:

x-common-env: &common-env
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  TZ: UTC

x-common-logging: &common-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: resolver-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      MCP_API_KEY: ${MCP_API_KEY:-dev-api-key-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: "sqlite:////data/resolver.db"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - .:/app
      - ./logs:/logs
      - sqlite_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - resolver-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *common-logging
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 2 --log-level info

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: resolver-mcp
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      MCP_API_KEY: ${MCP_API_KEY:-dev-api-key-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PAGERDUTY_KEY: ${PAGERDUTY_KEY:-}
    volumes:
      - .:/app
      - ./logs:/logs
    networks:
      - resolver-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *common-logging
    command: uvicorn mcp_server.server:app --host 0.0.0.0 --port 8001 --workers 2 --log-level info

  agent:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: resolver-agent
    restart: unless-stopped
    environment:
      <<: *common-env
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MCP_API_KEY: ${MCP_API_KEY:-dev-api-key-change-me}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - .:/app
      - ./logs:/logs
    depends_on:
      mcp-server:
        condition: service_healthy
    networks:
      - resolver-net
    logging: *common-logging
    command: python -m agent.agent

  redis:
    image: redis:7-alpine
    container_name: resolver-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - resolver-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *common-logging

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: resolver-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    networks:
      - resolver-net
    logging: *common-logging

  grafana:
    image: grafana/grafana:10.2.0
    container_name: resolver-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - resolver-net
    logging: *common-logging

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: resolver-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - resolver-net
    logging: *common-logging

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: resolver-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - resolver-net
    logging: *common-logging

  frontend:
    build:
      context: ./frontend
    container_name: resolver-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - resolver-net
